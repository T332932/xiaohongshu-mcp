# AI 自动发布调度器配置

# MCP 服务配置
mcp:
  base_url: "http://localhost:18060"  # MCP 服务地址

# AI 配置
ai:
  mode: "cli"                            # 模式: "api" 或 "cli"

  # CLI 模式配置 (推荐)
  cli_command: "gemini"                  # CLI 命令: gemini, claude 等

  # API 模式配置 (OpenAI 兼容接口)
  base_url: "https://api.openai.com/v1"  # 或使用其他兼容接口
  api_key: "${OPENAI_API_KEY}"           # 支持环境变量
  model: "gpt-4o-mini"                   # 模型名称

# 评论调度配置
comment:
  enabled: true              # 是否启用自动评论
  interval_min: 30           # 最小间隔(分钟)
  interval_max: 60           # 最大间隔(分钟)
  max_comments: 3            # 每次最多评论几个帖子
  search_keywords:           # 搜索关键词列表
    - "美食"
    - "生活"
    - "好物"
  system_prompt: |
    你是一个小红书用户，正在浏览帖子并发表评论。
    评论风格要求：
    - 真诚自然，像普通用户
    - 可以分享类似经历或表达认同
    - 可以提出友好的问题
    - 避免过度夸张或敷衍

# 发帖调度配置
post:
  enabled: true              # 是否启用自动发帖
  interval_min: 120          # 最小间隔(分钟)
  interval_max: 240          # 最大间隔(分钟)
  image_dir: "./images"      # 图片目录，发帖时随机选择
  topics:                    # 发帖主题列表，随机选择
    - "今日美食分享"
    - "生活小技巧"
    - "好物推荐"
    - "日常碎碎念"
